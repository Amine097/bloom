name: Build

# main:   every push is tested and compiled, nothing is published.
# deploy: every push is tested, compiled and published as a new release. Installed copies of
#         Bloom offer it at their next launch. To ship what is on main:
#             git push origin main:deploy
#         The version number is worked out by scripts/next-version.mjs.
on:
  push:
    branches: [main, deploy]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  mac:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/deploy' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release version is derived from the existing tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install

      - name: Work out the release version and notes
        id: next
        if: env.DEPLOY == 'true'
        run: node scripts/next-version.mjs --apply

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.DEPLOY == 'true' && format('v{0}', steps.next.outputs.version) || '' }}
          releaseName: Bloom v${{ steps.next.outputs.version }}
          releaseBody: ${{ steps.next.outputs.notes }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Keep the installer from builds that are not released
        if: env.DEPLOY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
