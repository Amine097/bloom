[package]
name = "bloom"
version = "0.1.0"
description = "Bloom - study tracker"
edition = "2021"

[lib]
name = "bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
